name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new Starlight release that changes the components hyper
  # copies is found without a pull request.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Vendored Aurora CSS matches its tag
        run: npm run check:vendor
      - name: The Starlight components that hyper copies are unchanged in the newest Starlight
        run: npm run check:upstream
      - name: Build the docs site
        run: |
          npm --prefix docs ci --no-audit --no-fund
          npm run docs:build
      - name: Check the docs site in Chrome (layers, tokens, contrast, hyper)
        run: npm run docs:check
      - name: The starter in template/ builds and passes the checks
        run: scripts/check-template.sh
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
