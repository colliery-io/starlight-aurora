name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Vendored Aurora CSS matches its tag
        run: npm run check:vendor
      - name: Build the demo site
        run: |
          npm --prefix demo ci --no-audit --no-fund
          npm run demo:build
      - name: Check the demo site in Chrome (layers, tokens, contrast)
        run: npm run demo:check
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
